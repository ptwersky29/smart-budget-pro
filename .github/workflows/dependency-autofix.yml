name: Safe dependency lockfile remediation

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-autofix.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

concurrency:
  group: dependency-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-within-declared-ranges:
    name: Apply compatible npm vulnerability patches if verification passes
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update vulnerable lock entries within declared semver
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-fund
      - name: Verify app still builds
        working-directory: frontend
        run: CI=false npm run build
      - name: Verify existing source lint
        working-directory: frontend
        run: npx eslint src/ --ext .js,.jsx
      - name: Commit only the verified lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No compatible lockfile updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Update compatible vulnerable frontend transitive dependencies"
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
