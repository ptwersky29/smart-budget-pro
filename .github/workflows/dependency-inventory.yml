name: Dependency vulnerability inventory (report only)

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/dependency-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inventory frontend dependency advisories (not a passing-security claim)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked packages without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Capture all npm advisories
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT SEVERITIES', JSON.stringify(counts));
          const entries = Object.entries(audit.vulnerabilities || {});
          for (const [name, v] of entries) {
            const direct = v.isDirect ? 'direct' : 'transitive';
            const fixes = v.fixAvailable;
            console.log(['AUDIT', v.severity, name, direct, v.range,
              typeof fixes === 'object' ? JSON.stringify(fixes) : String(fixes)].join(' | '));
          }
          console.log('Inventory only: passing this job does not mean vulnerabilities are fixed.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: penni-npm-audit-inventory
          path: frontend/npm-audit.json
          retention-days: 7
