  </head>
  <body>
    <script>
      // Recover from a stale chunk after a deploy — at most once per session so
      // a broken deploy cannot put the tab into a reload loop.
      window.addEventListener("error", function (e) {
        var target = e.target;
        if (!target || (target.tagName !== "SCRIPT" && target.tagName !== "LINK")) return;
        if (!(target.src || target.href)) return;
        e.preventDefault();
        try {
          if (sessionStorage.getItem("penni.chunk-reload") === "1") return;
          sessionStorage.setItem("penni.chunk-reload", "1");
        } catch (err) {
          return;
        }
        location.reload();
      }, true);
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
